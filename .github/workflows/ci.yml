name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'flashsale/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-southeast-1
  EKS_CLUSTER: flashsale-cluster

jobs:
  # =============================================================================
  # Job 1: Test
  # =============================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flashsale
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Tests
        run: |
          for service in api-gateway user-service product-service order-service purchase-service order-worker; do
            echo "Testing $service..."
            cd flashsale/$service
            go test -v -race ./... || echo "No tests"
            cd ../..
          done
        env:
          REDIS_ADDR: localhost:6379
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/flashsale?sslmode=disable

  # =============================================================================
  # Job 2: Build & Push to ECR
  # =============================================================================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Images
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd flashsale
          services="api-gateway user-service product-service order-service purchase-service order-worker"
          
          for svc in $services; do
            echo "Building $svc..."
            docker build -f deployments/Dockerfile.$svc -t $ECR_REGISTRY/flashsale/$svc:$IMAGE_TAG -t $ECR_REGISTRY/flashsale/$svc:latest .
            docker push $ECR_REGISTRY/flashsale/$svc:$IMAGE_TAG
            docker push $ECR_REGISTRY/flashsale/$svc:latest
            echo "✅ $svc pushed"
          done

  # =============================================================================
  # Job 3: Deploy to EKS (Manual Trigger)
  # =============================================================================
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Update Image Tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY=$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/flashsale
          
          for file in k8s/services/*.yaml; do
            sed -i "s|REGISTRY_URL|$ECR_REGISTRY|g" $file
            sed -i "s|:latest|:$IMAGE_TAG|g" $file
          done

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/service-account.yaml
          kubectl apply -f k8s/services/

      - name: Wait for Rollout
        run: |
          for deploy in api-gateway user-service product-service order-service purchase-service order-worker; do
            kubectl rollout status deployment/$deploy -n flashsale --timeout=300s
          done

      - name: Verify Deployment
        run: kubectl get pods -n flashsale