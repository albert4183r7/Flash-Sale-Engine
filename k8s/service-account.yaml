# =============================================================================
# Flash Sale Engine - ServiceAccount with AWS IRSA
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flashsale-sa
  namespace: flashsale
  labels:
    app.kubernetes.io/part-of: flashsale-engine
  annotations:
    # AWS IAM Role for Service Accounts (IRSA)
    # UPDATE: Replace with your actual IAM role ARN from terraform output
    eks.amazonaws.com/role-arn: "arn:aws:iam::462009754058:role/flashsale-workload-role"
