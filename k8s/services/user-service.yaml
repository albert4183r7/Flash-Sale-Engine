# =============================================================================
# User Service - Deployment & Service
# Authentication & user management
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: flashsale
  labels:
    app: user-service
    tier: backend
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: flashsale-engine
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        tier: backend
    spec:
      serviceAccountName: flashsale-sa
      
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: user-service

      containers:
        - name: user-service
          image: 462009754058.dkr.ecr.ap-southeast-1.amazonaws.com/flashsale/user-service:latest
          imagePullPolicy: Always
          
          ports:
            - containerPort: 8082
              name: http
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          env:
            - name: USER_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: flashsale-config
                  key: USER_SERVICE_PORT
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: flashsale-config
                  key: REDIS_ADDR
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: jwt-secret
            - name: TOKEN_EXPIRY
              valueFrom:
                configMapKeyRef:
                  name: flashsale-config
                  key: TOKEN_EXPIRY
            # Database connection
            - name: USER_POSTGRES_URL
              value: "postgres://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/flashsale_users?sslmode=disable"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flashsale-secrets
                  key: db-password
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: flashsale-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: flashsale-config
                  key: DB_PORT

          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]

      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: flashsale
  labels:
    app: user-service
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: flashsale-engine
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service-hpa
  namespace: flashsale
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
