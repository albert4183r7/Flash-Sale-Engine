# Full local stack: infrastructure plus the three Go services.
#
# Configuration comes from .env (copy it from .env.example first). Each service
# also receives an `environment:` block that overrides the host-oriented values
# in .env with the hostnames that apply inside the Compose network.

services:
  redis:
    image: redis:7-alpine
    container_name: flashsale-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      sh -c '
      if [ -n "${REDIS_PASSWORD}" ]; then
        redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}";
      else
        redis-server --appendonly yes;
      fi'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flashsale-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: flashsale-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flashsale-network

  postgres:
    image: postgres:17-alpine
    container_name: flashsale-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-flashsale}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only when the data directory is empty. Re-apply by hand, or drop
      # the volume, after changing the schema.
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-flashsale}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flashsale-network

  api-gateway:
    build:
      context: .
      dockerfile: deployments/Dockerfile.api-gateway
    container_name: flashsale-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      purchase-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flashsale-network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_GATEWAY_PORT: 8080
      POSTGRES_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-flashsale}?sslmode=disable
      REDIS_ADDR: redis:6379
      PURCHASE_SERVICE_URL: http://purchase-service:8081
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  purchase-service:
    build:
      context: .
      dockerfile: deployments/Dockerfile.purchase-service
    container_name: flashsale-purchase-service
    # Deliberately not published to the host: this service trusts the user ID in
    # its request bodies and is reachable only by the gateway over the Compose
    # network. Its routes additionally require INTERNAL_API_TOKEN.
    expose:
      - "8081"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - flashsale-network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PURCHASE_SERVICE_PORT: 8081
      POSTGRES_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-flashsale}?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-worker:
    build:
      context: .
      dockerfile: deployments/Dockerfile.order-worker
    container_name: flashsale-order-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - flashsale-network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-flashsale}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/

networks:
  flashsale-network:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
  postgres_data:
