version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: flashsale-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Use password only if set, otherwise default to no password configuration
    command: >
      sh -c '
      if [ -n "${REDIS_PASSWORD}" ]; then
        redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}";
      else
        redis-server --appendonly yes;
      fi'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flashsale-network
    env_file:
      - .env

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: flashsale-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flashsale-network
    env_file:
      - .env

  postgres:
    image: postgres:15-alpine
    container_name: flashsale-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Fallback to 'postgres' if variable is empty (crucial for Docker startup)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-flashsale}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flashsale-network
    env_file:
      - .env

  api-gateway:
    build:
      context: .
      dockerfile: deployments/Dockerfile.api-gateway
    container_name: flashsale-api-gateway
    ports:
      # Maps Host Port (from .env) -> Container Port (8080)
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      purchase-service:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - flashsale-network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Internal container config
      PORT: 8080
      POSTGRES_HOST: postgres
      PURCHASE_SERVICE_URL: http://purchase-service:8081

  purchase-service:
    build:
      context: .
      dockerfile: deployments/Dockerfile.purchase-service
    container_name: flashsale-purchase-service
    ports:
      # Maps Host Port (from .env) -> Container Port (8081)
      - "${PURCHASE_SERVICE_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - flashsale-network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Internal container config
      PORT: 8081
      POSTGRES_HOST: postgres
      REDIS_ADDR: redis:6379

  order-worker:
    build:
      context: .
      dockerfile: deployments/Dockerfile.order-worker
    container_name: flashsale-order-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - flashsale-network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres

networks:
  flashsale-network:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
  postgres_data: