# Flash Sale Engine - Docker Compose Configuration

services:
  # ==================== INFRASTRUCTURE ====================
  redis:
    image: redis:7-alpine
    container_name: flashsale-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      sh -c ' if [ -n "${REDIS_PASSWORD}" ]; then
        redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}";
      else
        redis-server --appendonly yes;
      fi'
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flashsale-network
    env_file:
      - .env

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: flashsale-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flashsale-network
    env_file:
      - .env

  # ==================== DATABASES (Separate per Service) ====================
  user-db:
    image: postgres:17-alpine
    container_name: flashsale-user-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: flashsale_users
    volumes:
      - user_db_data:/var/lib/postgresql/data
      - ./migrations/users.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flashsale-network

  product-db:
    image: postgres:17-alpine
    container_name: flashsale-product-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: flashsale_products
    volumes:
      - product_db_data:/var/lib/postgresql/data
      - ./migrations/products.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flashsale-network

  order-db:
    image: postgres:17-alpine
    container_name: flashsale-order-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: flashsale_orders
    volumes:
      - order_db_data:/var/lib/postgresql/data
      - ./migrations/orders.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flashsale-network

  # ==================== MICROSERVICES ====================
  user-service:
    build:
      context: .
      dockerfile: deployments/Dockerfile.user-service
    container_name: flashsale-user-service
    ports:
      - "8082:8082"
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flashsale-network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      USER_SERVICE_PORT: 8082
      USER_POSTGRES_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@user-db:5432/flashsale_users?sslmode=disable
      REDIS_ADDR: redis:6379

  product-service:
    build:
      context: .
      dockerfile: deployments/Dockerfile.product-service
    container_name: flashsale-product-service
    ports:
      - "8083:8083"
    depends_on:
      product-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flashsale-network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PRODUCT_SERVICE_PORT: 8083
      PRODUCT_POSTGRES_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@product-db:5432/flashsale_products?sslmode=disable
      REDIS_ADDR: redis:6379

  order-service:
    build:
      context: .
      dockerfile: deployments/Dockerfile.order-service
    container_name: flashsale-order-service
    ports:
      - "8084:8084"
    depends_on:
      order-db:
        condition: service_healthy
    networks:
      - flashsale-network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ORDER_SERVICE_PORT: 8084
      ORDER_POSTGRES_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@order-db:5432/flashsale_orders?sslmode=disable

  purchase-service:
    build:
      context: .
      dockerfile: deployments/Dockerfile.purchase-service
    container_name: flashsale-purchase-service
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - flashsale-network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PURCHASE_SERVICE_PORT: 8081
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PRODUCT_SERVICE_URL: http://product-service:8083

  order-worker:
    build:
      context: .
      dockerfile: deployments/Dockerfile.order-worker
    container_name: flashsale-order-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      order-service:
        condition: service_started
      product-service:
        condition: service_started
    networks:
      - flashsale-network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ORDER_SERVICE_URL: http://order-service:8084
      PRODUCT_SERVICE_URL: http://product-service:8083

  api-gateway:
    build:
      context: .
      dockerfile: deployments/Dockerfile.api-gateway
    container_name: flashsale-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      purchase-service:
        condition: service_started
    networks:
      - flashsale-network
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_GATEWAY_PORT: 8080
      USER_SERVICE_URL: http://user-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      PURCHASE_SERVICE_URL: http://purchase-service:8081

networks:
  flashsale-network:
    driver: bridge

volumes:
  redis_data:
  rabbitmq_data:
  user_db_data:
  product_db_data:
  order_db_data:
