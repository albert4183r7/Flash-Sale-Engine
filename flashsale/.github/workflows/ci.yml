name: Flash Sale CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Integration Test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flashsale
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Test API Gateway
        working-directory: ./api-gateway
        run: go test -v ./... || echo "No tests found"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/flashsale?sslmode=disable

      - name: Test Purchase Service
        working-directory: ./purchase-service
        run: go test -v ./... || echo "No tests found"
        env:
          REDIS_ADDR: localhost:6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/flashsale?sslmode=disable

      - name: Test Order Worker
        working-directory: ./order-worker
        run: go test -v ./... || echo "No tests found"
        env:
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/flashsale?sslmode=disable