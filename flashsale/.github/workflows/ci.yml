name: Flash Sale CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Check formatting - API Gateway
        working-directory: ./api-gateway
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'go fmt ./...'"
            gofmt -l .
            exit 1
          fi

      - name: Check formatting - Purchase Service
        working-directory: ./purchase-service
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'go fmt ./...'"
            gofmt -l .
            exit 1
          fi

      - name: Check formatting - Order Worker
        working-directory: ./order-worker
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'go fmt ./...'"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet - API Gateway
        working-directory: ./api-gateway
        run: go vet ./...

      - name: Run go vet - Purchase Service
        working-directory: ./purchase-service
        run: go vet ./...

      - name: Run go vet - Order Worker
        working-directory: ./order-worker
        run: go vet ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download dependencies - API Gateway
        working-directory: ./api-gateway
        run: go mod download

      - name: Download dependencies - Purchase Service
        working-directory: ./purchase-service
        run: go mod download

      - name: Download dependencies - Order Worker
        working-directory: ./order-worker
        run: go mod download

      - name: Build API Gateway
        working-directory: ./api-gateway
        run: go build -v -o ../bin/api-gateway .

      - name: Build Purchase Service
        working-directory: ./purchase-service
        run: go build -v -o ../bin/purchase-service .

      - name: Build Order Worker
        working-directory: ./order-worker
        run: go build -v -o ../bin/order-worker .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployments/Dockerfile.api-gateway
          push: false
          tags: flashsale/api-gateway:latest

      - name: Build Purchase Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployments/Dockerfile.purchase-service
          push: false
          tags: flashsale/purchase-service:latest

      - name: Build Order Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployments/Dockerfile.order-worker
          push: false
          tags: flashsale/order-worker:latest

  test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: docker
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flashsale
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Test API Gateway
        working-directory: ./api-gateway
        run: go test -v ./... || echo "No tests found"

      - name: Test Purchase Service
        working-directory: ./purchase-service
        run: go test -v ./... || echo "No tests found"
        env:
          REDIS_ADDR: localhost:6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/

      - name: Test Order Worker
        working-directory: ./order-worker
        run: go test -v ./... || echo "No tests found"
        env:
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/flashsale?sslmode=disable
